# SignTools with built-in Linux signing and Apple ID provisioning.
#   cp signer-cfg.example.yml signer-cfg.yml   # then edit server_url and the password
#   mkdir -p data/import && docker compose up -d --build
# Big apps: copy them into ./data/import (rsync / SMB / scp) and pick them in the web UI ("Server" switch).
services:
  signtools:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # writable: SignTools writes the config back on start (adds missing defaults)
      - ./signer-cfg.yml:/signer-cfg.yml
      # apps, profiles, Apple ID sessions + certificate keys (data/portal), work dir, import dir
      - ./data:/data
# No anisette container: since 2026-10 Apple rejects Apple ID logins with anisette made by Apple's
# Android libraries (what anisette-v3-server uses) with SRP error -80045. Logins use a Mac-backed
# anisette v3 server instead (Impactor's default, see apple_id.anisette_url).
